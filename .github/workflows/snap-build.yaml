name: Snap build

on:
  workflow_call:
    inputs:
      build-from:
        description: Build the recipe tag or upstream HEAD (tag/head).
        type: string
        default: tag
      channel:
        description: Store channel. Leave empty to build only.
        type: string
        default: ''
      test-command:
        description: Optional command to run after installing the snap.
        type: string
        default: ''
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build-from }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.build-from }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        build-from: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["tag", "head"]')
              || fromJSON(format('[{0}]', toJSON(inputs.build-from))) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare upstream HEAD
        if: matrix.build-from == 'head'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

          python3 <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import yaml

          path = Path('snap/snapcraft.yaml')
          recipe = yaml.safe_load(path.read_text())
          parts = recipe['parts']
          tagged = [(name, part) for name, part in parts.items() if 'source-tag' in part]

          if len(tagged) != 1:
              raise SystemExit('HEAD builds need exactly one part with source-tag.')

          name, part = tagged[0]
          result = subprocess.check_output(
              ['git', 'ls-remote', '--exit-code', part['source'], 'HEAD'],
              text=True,
              timeout=60,
          )
          commit = result.split()[0]
          source = {key: value for key, value in part.items() if key != 'source-tag'}
          recipe = {
              **recipe,
              'grade': 'devel',
              'parts': {**parts, name: {**source, 'source-commit': commit}},
          }

          if 'adopt-info' in recipe:
              adopt = recipe['adopt-info']
              metadata = recipe['parts'][adopt]
              setter = re.compile(r'^([ \t]*)craftctl set version=(.+)$', re.MULTILINE)
              matches = [
                  (step, match)
                  for step, script in metadata.items() if step.startswith('override-')
                  for match in setter.finditer(script)
              ]
              if len(matches) != 1:
                  raise SystemExit('HEAD builds need one standalone craftctl set version command in the adopt-info part.')

              step, match = matches[0]
              indent, expression = match.groups()
              replacement = (
                  f'{indent}snap_head_version={expression}\n'
                  f"{indent}snap_head_version=$(printf '%s' \"$snap_head_version\" | sed -E 's/-[0-9]+-g[0-9a-f]+$//')\n"
                  f"{indent}craftctl set version=\"$(printf '%.24s' \"$snap_head_version\")-{commit[:7]}\""
              )
              script = metadata[step]
              updated = script[:match.start()] + replacement + script[match.end():]
              recipe = {
                  **recipe,
                  'parts': {**recipe['parts'], adopt: {**metadata, step: updated}},
              }
          else:
              version = str(recipe['version'])[:24]
              recipe = {**recipe, 'version': f'{version}-{commit[:7]}'}

          path.write_text(yaml.safe_dump(recipe, sort_keys=False))
          print(f'Building upstream commit {commit}')
          PYTHON

      - name: Check source and show snapcraft.yaml
        env:
          BUILD_FROM: ${{ matrix.build-from }}
        run: |
          if [[ "$BUILD_FROM" != tag && "$BUILD_FROM" != head ]]; then
            echo 'build-from must be tag or head' >&2
            exit 1
          fi
          cat snap/snapcraft.yaml

      - name: Build snap
        id: snap
        uses: canonical/action-build@v1
        with:
          build-info: true

      - name: Show Snapcraft logs on failure
        if: failure() && steps.snap.outcome == 'failure'
        run: |
          shopt -s nullglob
          logs=("${XDG_STATE_HOME:-$HOME/.local/state}"/snapcraft/log/*.log)
          if (( ${#logs[@]} == 0 )); then
            echo 'No Snapcraft log files were created.'
          fi
          for log in "${logs[@]}"; do
            echo "::group::Snapcraft log: $(basename "$log")"
            stop_token=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$stop_token"
            cat "$log"
            printf '\n::%s::\n' "$stop_token"
            echo '::endgroup::'
          done

      - name: Run optional command
        if: inputs.test-command != ''
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          bash -euo pipefail -c "$TEST_COMMAND"

      - name: Read artifact name
        id: metadata
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
        run: |
          # Snapcraft names packages <name>_<version>_<arch>.snap.
          filename=$(basename "$SNAP_FILE" .snap)
          echo "name=${filename//_/-}" >> "$GITHUB_OUTPUT"

      - name: Save snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

      - name: Publish snap
        if: >-
          inputs.channel != '' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
        timeout-minutes: 30
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload "$SNAP_FILE" --release "$CHANNEL"
