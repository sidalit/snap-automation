name: Snap build

on:
  workflow_call:
    inputs:
      architectures:
        description: JSON array of architectures to build (amd64, arm64).
        type: string
        default: '["amd64", "arm64"]'
      build-from:
        description: Build the recipe tag, upstream HEAD, or both (tag/head/both).
        type: string
        default: >-
          ${{ github.event.inputs.build-from ||
              (github.event_name == 'schedule' && 'head' || 'both') }}
      publish:
        description: Publish a manual build to edge for HEAD or beta for a release tag.
        type: boolean
        default: ${{ github.event.inputs.publish == 'true' }}
      test-command:
        description: Optional command to run after installing the snap.
        type: string
        default: ''
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: snap-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.build-from }}-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.build-from }} / ${{ matrix.arch }}
    runs-on: >-
      ${{ fromJSON('{"amd64": "ubuntu-26.04", "arm64": "ubuntu-26.04-arm"}')[matrix.arch] }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
        build-from: >-
          ${{ inputs.build-from == 'both'
              && fromJSON('["tag", "head"]')
              || fromJSON(format('[{0}]', toJSON(inputs.build-from))) }}
    steps:
      - name: Fetch packaging
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare upstream HEAD
        id: prepare
        if: matrix.build-from == 'head'
        run: |
          recipe=snap/snapcraft.yaml
          if ! upstream=$(yq -er '
            [.parts[] | select(.source-tag // "" | contains("SNAPCRAFT_PROJECT_VERSION"))] |
            select(length == 1) | .[0].source
          ' "$recipe"); then
            echo '::error::Exactly one part must reference SNAPCRAFT_PROJECT_VERSION in source-tag.'
            exit 1
          fi
          commit=$(timeout 60 git ls-remote --exit-code -- "$upstream" HEAD | cut -f1)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          export SNAP_COMMIT="$commit" SNAP_VERSION="git-${commit:0:7}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          yq -i '
            .version = strenv(SNAP_VERSION) |
            .grade = "devel" |
            with(.parts[] | select(.source-tag // "" | contains("SNAPCRAFT_PROJECT_VERSION"));
              .source-commit = strenv(SNAP_COMMIT) | del(.source-tag)
            )
          ' "$recipe"

      - name: Check source and show snapcraft.yaml
        env:
          BUILD_FROM: ${{ inputs.build-from }}
        run: |
          if [[ "$BUILD_FROM" != tag && "$BUILD_FROM" != head && "$BUILD_FROM" != both ]]; then
            echo 'build-from must be tag, head or both' >&2
            exit 1
          fi
          cat snap/snapcraft.yaml

      - name: Build snap
        id: snap
        uses: canonical/craft-actions/snapcraft/pack@v1
        env:
          SNAPCRAFT_BUILD_INFO: '1'
        with:
          verbosity: verbose

      - name: Show Snapcraft logs on failure
        if: failure() && steps.snap.outcome == 'failure'
        run: |
          shopt -s nullglob
          logs=("${XDG_STATE_HOME:-$HOME/.local/state}"/snapcraft/log/*.log)
          if (( ${#logs[@]} == 0 )); then
            echo 'No Snapcraft log files were created.'
          fi
          for log in "${logs[@]}"; do
            echo "::group::Snapcraft log: $(basename "$log")"
            stop_token=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$stop_token"
            cat "$log"
            printf '\n::%s::\n' "$stop_token"
            echo '::endgroup::'
          done

      - name: Show runner diagnostics on failure
        if: failure() && steps.snap.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo '::group::Runner diagnostics'
          stop_token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$stop_token"
          free -h || true
          df -h / || true
          echo 'Kernel messages:'
          timeout --kill-after=5s 20s sudo -n journalctl --boot --dmesg \
            --since '2 hours ago' --lines=300 --no-pager || true
          echo 'LXD and OOM service messages:'
          timeout --kill-after=5s 20s sudo -n journalctl --boot \
            --unit=snap.lxd.daemon.service --unit=systemd-oomd.service \
            --since '2 hours ago' --lines=300 --no-pager || true
          printf '\n::%s::\n' "$stop_token"
          echo '::endgroup::'

      - name: Read artifact name
        id: metadata
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snaps }}
        run: |
          # Snapcraft names packages <name>_<version>_<arch>.snap.
          filename=$(basename "$SNAP_FILE" .snap)
          version=${filename#*_}
          version=${version%_*}
          echo "name=${filename//_/-}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: |
            ${{ steps.snap.outputs.snaps }}
            *.comp
          if-no-files-found: error
          compression-level: 0

      - name: Test snap (optional)
        id: test
        if: inputs.test-command != ''
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snaps }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          bash -euo pipefail -c "$TEST_COMMAND"

      - name: Publish snap
        id: publish
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (contains(fromJSON('["push", "schedule"]'), github.event_name) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        timeout-minutes: 45
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.snap.outputs.snaps }}
          COMPONENTS: ${{ steps.snap.outputs.components }}
          CHANNEL: ${{ matrix.build-from == 'head' && 'edge' || 'beta' }}
        run: |
          # Components are uploaded with their snap: <snap>+<name>[_<version>].comp
          args=()
          for comp in $COMPONENTS; do
            if (( $(stat -c%s "$comp") > 5 * 1024 ** 3 )); then
              echo "::error::$comp exceeds the Snap Store's 5 GB component limit."
              exit 1
            fi
            name=${comp##*+}
            name=${name%.comp}
            args+=(--component "${name%%_*}=$comp")
          done
          # Retry only network failures that happen before the store starts
          # processing the upload, which it reports with "Status:" lines. Store
          # answers, such as permission or review errors, fail at once.
          network_errors=(
            -e "('Connection aborted.', "
            -e 'Maximum retries exceeded trying to reach the store.'
            -e 'Issue encountered while processing your request: [502]'
            -e 'Issue encountered while processing your request: [503]'
            -e 'Issue encountered while processing your request: [504]'
          )
          output=$(mktemp)
          for attempt in 1 2 3; do
            if snapcraft upload "$SNAP_FILE" "${args[@]}" --release "$CHANNEL" 2>&1 |
              tee "$output" | sed -u '/^Status: processing\r*$/d'; then
              sed -nE 's/^Revision ([0-9]+) created.*/revision=\1/p' "$output" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( attempt == 3 )) || grep -q '^Status: ' "$output" ||
              ! grep -Fq "${network_errors[@]}" "$output"; then
              exit 1
            fi
            delay=$((attempt * 60))
            echo "::warning::Upload attempt $attempt lost the Snap Store connection; retrying in $delay seconds."
            sleep "$delay"
          done

      - name: Summarize result
        if: always()
        env:
          ARTIFACT: ${{ steps.metadata.outputs.name || 'Not built' }}
          VERSION: ${{ steps.metadata.outputs.version || 'Unavailable' }}
          ARCH: ${{ matrix.arch }}
          BUILD_FROM: ${{ matrix.build-from }}
          UPSTREAM_COMMIT: ${{ matrix.build-from == 'head' && (steps.prepare.outputs.commit || 'Unresolved') || 'Recipe release tag' }}
          BUILD_RESULT: ${{ steps.snap.outcome }}
          TEST_RESULT: ${{ inputs.test-command == '' && 'not configured' || steps.test.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome || 'skipped' }}
          CHANNEL: ${{ matrix.build-from == 'head' && 'edge' || 'beta' }}
          REVISION: ${{ steps.publish.outputs.revision || 'none' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### $BUILD_FROM / $ARCH

          | Item | Result |
          |---|---|
          | Artifact | $ARTIFACT |
          | Version | $VERSION |
          | Upstream | $UPSTREAM_COMMIT |
          | Build | $BUILD_RESULT |
          | Test | $TEST_RESULT |
          | Publish ($CHANNEL) | $PUBLISH_RESULT |
          | Revision | $REVISION |
          EOF
